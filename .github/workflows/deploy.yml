name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy in EC2
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Manage SSH access
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/planify-deploy
          chmod 600 ~/.ssh/planify-deploy

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy commit in EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/planify-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /home/ubuntu/planify-backend && \
             git fetch origin && \
             git reset --hard '${DEPLOY_SHA}' && \
             bash infra/deploy.sh"
