name: Format and rules validator

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://test:test@localhost:5432/planify_test
      JWT_SECRET: 9fZk2pQvasdh42SsdmXrYcHjNwTxjW3Sks24As2dAgI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: planify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d planify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chneck format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check KPI reporter
        run: npm run typecheck:kpi-reporter

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
